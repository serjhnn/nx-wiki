name: Android app

on:
  push:
    branches: ["**"]
    tags: ["v*"]          # a tag like v1.0 publishes a GitHub Release with the APK
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write         # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the wiki (offline copy)
        run: |
          pip install -r requirements.txt
          NX_OFFLINE=true NX_SITE_DIR=site-offline zensical build --strict

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Copy the wiki into the Android project
        working-directory: app
        run: |
          npm ci
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set version and signing key
        env:
          NX_KEYSTORE_BASE64: ${{ secrets.NX_KEYSTORE_BASE64 }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${{ github.run_number }}-${GITHUB_SHA::7}"
          fi
          echo "NX_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "NX_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [ -n "$NX_KEYSTORE_BASE64" ]; then
            echo "$NX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nx-wiki.keystore"
            echo "NX_KEYSTORE_FILE=$RUNNER_TEMP/nx-wiki.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::NX_KEYSTORE_BASE64 secret not set; the APK is signed with a temporary debug key"
          fi

      - name: Build APK
        working-directory: app/android
        env:
          NX_KEYSTORE_PASSWORD: ${{ secrets.NX_KEYSTORE_PASSWORD }}
          NX_KEY_ALIAS: ${{ secrets.NX_KEY_ALIAS }}
          NX_KEY_PASSWORD: ${{ secrets.NX_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/nx-wiki-$NX_VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/nx-wiki-$NX_VERSION_NAME.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: nx-wiki-android
          path: out/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk

  # Installs the APK on an Android emulator and takes screenshots, to check that it starts
  smoke-test:
    needs: build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nx-wiki-android
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            mkdir -p screenshots
            adb install out/nx-wiki-*.apk
            sleep 30
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb shell am start -W -n io.github.serjhnn.nxwiki/.MainActivity
            sleep 15
            adb exec-out screencap -p > screenshots/1-home.png
            adb shell input swipe 540 1800 540 600 400
            sleep 3
            adb exec-out screencap -p > screenshots/2-scrolled.png
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell input swipe 540 2000 540 600 300
            sleep 3
            adb exec-out screencap -p > screenshots/3-app-drawer.png
            adb logcat -d > screenshots/logcat.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: screenshots/
