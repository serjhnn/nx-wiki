site_name: nx-wiki
site_description: My personal knowledge base
repo_url: https://github.com/serjhnn/nx-wiki
repo_name: serjhnn/nx-wiki
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  hljs_style: github-dark
  navigation_depth: 3
  collapse_navigation: false
  prev_next_buttons_location: both

extra_css:
  - assets/dark.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js
  - assets/extra.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Writing pages: getting-started/writing-pages.md
