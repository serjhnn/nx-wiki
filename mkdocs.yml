site_name: nx-wiki
site_url: https://serjhnn.github.io/nx-wiki/
site_description: My personal knowledge base
repo_url: https://github.com/serjhnn/nx-wiki
repo_name: serjhnn/nx-wiki
edit_uri: edit/main/docs/
site_dir: !ENV [NX_SITE_DIR, site]

theme:
  name: material
  variant: modern
  custom_dir: overrides
  favicon: assets/icons/icon.svg
  logo: assets/icons/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow
  palette:
    # The toggle cycles dark -> full black -> light. Full black reuses the
    # slate (dark) scheme; primary "black" lets style.css tell it apart
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon-star
        name: Switch to full black mode
    - scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to dark mode

plugins:
  - search
  # Download web fonts and Mermaid at build time and serve them from the
  # site itself, so pages don't depend on external servers
  - privacy:
      assets_exclude:
        - unpkg.com/pyodide*
        - unpkg.com/ace-builds*
        - unpkg.com/glightbox*
        - cdn.jsdelivr.net/*
        - cdn.plyr.io/*
  # Make the site work when opened from disk (file://); only for the
  # downloadable offline copy, enabled with NX_OFFLINE=true
  - offline:
      enabled: !ENV [NX_OFFLINE, false]

extra_css:
  - assets/style.css
  - assets/vendor/katex/katex.min.css

extra_javascript:
  - assets/vendor/katex/katex.min.js
  - assets/vendor/katex/contrib/auto-render.min.js
  - assets/katex.js
  - assets/pwa.js
  - assets/zoom.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Writing pages: getting-started/writing-pages.md
  - Mechanics:
      - mechanics/index.md
      - Navier–Stokes equations: mechanics/navier-stokes.md
      - Euler equations: mechanics/euler-equations.md
  - Networking:
      - networking/index.md
      - MAC layer: networking/mac-layer.md
